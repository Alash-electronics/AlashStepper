sentence=Stepper motors with any driver: 28BYJ-48 + ULN2003, NEMA17 via A4988 / DRV8825 / TB6600 (STEP/DIR) and bipolar motors via L298N: angles, microsteps, smooth acceleration, non-blocking.
paragraph=Drives stepper motors with one simple interface for three kinds of drivers: the 28BYJ-48 with a ULN2003 board, any bipolar motor through a STEP/DIR driver (A4988, DRV8825, TMC2208, TB6600) with microsteps, an enable pin and pulse width, and a 4-wire bipolar motor through two H-bridges (L298N, L293D, TB6612). Turn by an angle or revolutions, spin continuously, smooth acceleration and braking without missed steps, non-blocking run() in loop(), automatic coil release. Explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
